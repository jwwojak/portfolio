site_url: https://jwwojak.github.io/portfolio/
site_name: Joe Wojak | Technical Writer & Docs-as-Code Specialist

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/file-document-multiple-outline
  favicon: images/favicon/file-document-multiple-outline.svg
  features:
    - navigation.indexes
    - navigation.instant      # Fast page loads without full browser refreshes
    - navigation.tracking     # Updates URL anchor in address bar as the user scrolls
    - navigation.top          # Adds a "Back to Top" button when scrolling down long pages
    - search.suggest          # Show auto-complete search query suggestions as you type
    - search.highlight        # Highlight search keywords directly on the destination page
    - content.code.copy       # Adds a 1-click "Copy Code" button to all Python/bash blocks

plugins:
  - search
  - social

# --- Social links ---
extra:
  robots: noindex, nofollow
  sitemap: 
    enabled: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jwwojak
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/joewojak
    - icon: fontawesome/solid/paper-plane
      link: mailto:jwojak@gmail.com

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Resume: resume.md
  - Writing Samples:
      - Overview: writing-samples/index.md
      - Labeling Liquids in Wells: writing-samples/api-docs.md
      - Budget Distribution & Update Cycles: writing-samples/budget-updates.md
      - Data Center Budget Distribution: writing-samples/budget-distribution.md
      - Fix Delivery Delays With Budget Update: writing-samples/budget-delay.md
      - Confidence Scores & Report Results: writing-samples/confidence-scores.md

copyright: Copyright &copy; 2026 Joe Wojak

markdown_extensions:
  - def_list
  - toc:
      title: Contents
      permalink: True
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true